name: Build and Upload to R2 (Stable/Beta)
name: Build and Upload to R2 (Stable/Beta)
name: Build and Upload to R2 (Stable/Beta)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      STABLE_BUCKET: pixelplay
      BETA_BUCKET: pixellauncher
      STABLE_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixelplay
      BETA_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixellauncher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GH_PAT }}
        with:
          packageManager: yarn
          args: --release

      - name: Package artifacts
        run: |
          mkdir -p ci-artifacts
          cp -r src-tauri/target/release/bundle/* ci-artifacts/ || true

      - name: Set upload variables
        id: setvars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "bucket=${{ env.STABLE_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.STABLE_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "type=stable" >> $GITHUB_OUTPUT
          else
            echo "bucket=${{ env.BETA_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.BETA_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "type=beta" >> $GITHUB_OUTPUT
          fi

      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install awscli

      - name: Remove previous builds for this arch/os
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          # Detect OS/arch and version
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [[ "$OS_NAME" == "darwin" ]]; then
            if [[ $(uname -m) == "arm64" ]]; then
              OS_NAME="mac-arm"
            else
              OS_NAME="mac-intel"
            fi
          fi
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          aws --endpoint-url "$R2_ENDPOINT" s3 rm s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/ --recursive || true

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [[ "$OS_NAME" == "darwin" ]]; then
            if [[ $(uname -m) == "arm64" ]]; then
              OS_NAME="mac-arm"
            else
              OS_NAME="mac-intel"
            fi
          fi
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          aws --endpoint-url "$R2_ENDPOINT" s3 sync ci-artifacts/ s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/ --exact-timestamps

      - name: Generate and upload version JSON
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
          TYPE: ${{ steps.setvars.outputs.type }}
        run: |
          OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
          if [[ "$OS_NAME" == "darwin" ]]; then
            if [[ $(uname -m) == "arm64" ]]; then
              OS_NAME="mac-arm"
            else
              OS_NAME="mac-intel"
            fi
          fi
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          BUILD_NAME="pixelplay-launcher"
          FORMAT="zip"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > version.json <<EOF
{
  "version": "$VERSION",
  "name": "$BUILD_NAME",
  "format": "$FORMAT",
  "os": "$OS_NAME",
  "timestamp": "$TIMESTAMP",
  "type": "$TYPE"
}
EOF
          aws --endpoint-url "$R2_ENDPOINT" s3 cp version.json s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/version.json
