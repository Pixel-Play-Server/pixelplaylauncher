name: Build and Upload to R2 (Windows)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      STABLE_BUCKET: pixelplay
      BETA_BUCKET: pixellauncher
      STABLE_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixelplay
      BETA_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixellauncher
      STABLE_PUBLIC_BASE_URL: https://pub-dda9306a363141bc9aece427638fbb4a.r2.dev/pixelplay/releases-v2
      BETA_PUBLIC_BASE_URL: https://pub-fb468072650f40c9884e13b2bc758f60.r2.dev/pixelplay/releases-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Build Tauri app
        run: npx tauri build
        env:
          PERSONAL_GH_PAT: ${{ secrets.PERSONAL_GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package artifacts
        run: |
          mkdir -p ci-artifacts
          cp -r src-tauri/target/release/bundle/nsis/* ci-artifacts/

      - name: Set upload variables
        id: setvars
        run: |
          if ("${{ github.ref_name }}" -eq "main") {
            echo "bucket=${{ env.STABLE_BUCKET }}" >> $env:GITHUB_OUTPUT
            echo "endpoint=${{ env.STABLE_ENDPOINT }}" >> $env:GITHUB_OUTPUT
            echo "public_base_url=${{ env.STABLE_PUBLIC_BASE_URL }}" >> $env:GITHUB_OUTPUT
            echo "type=stable" >> $env:GITHUB_OUTPUT
          } else {
            echo "bucket=${{ env.BETA_BUCKET }}" >> $env:GITHUB_OUTPUT
            echo "endpoint=${{ env.BETA_ENDPOINT }}" >> $env:GITHUB_OUTPUT
            echo "public_base_url=${{ env.BETA_PUBLIC_BASE_URL }}" >> $env:GITHUB_OUTPUT
            echo "type=beta" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Install AWS CLI
        run: |
          pip3 install --user --upgrade pip
          pip3 install --user awscli

      - name: Remove previous builds for this arch/os
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          $OS_NAME="windows-x86_64"
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          aws --endpoint-url "$env:R2_ENDPOINT" s3 rm "s3://$env:R2_BUCKET/releases-v2/$OS_NAME/$VERSION/" --recursive
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous builds found or unable to remove. Continuing..."
          }
          exit 0
        shell: pwsh

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          $OS_NAME="windows-x86_64"
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Get-ChildItem ci-artifacts -File | ForEach-Object {
            $filename = $_.Name
            Write-Host "Uploading: $filename"
            aws --endpoint-url "$env:R2_ENDPOINT" s3 cp $_.FullName "s3://$env:R2_BUCKET/releases-v2/$OS_NAME/$VERSION/$filename"
          }
        shell: pwsh

      - name: Generate and upload version JSON
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
          TYPE: ${{ steps.setvars.outputs.type }}
          PUBLIC_BASE_URL: ${{ steps.setvars.outputs.public_base_url }}
        run: |
          $OS_NAME="windows-x86_64"
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $TIMESTAMP = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $sigFile = Get-ChildItem ci-artifacts -File -Filter "*.sig" | Select-Object -First 1
          if (-not $sigFile) {
            throw "No signature file (*.sig) found in ci-artifacts; updater manifest cannot be generated."
          }
          $artifactName = $sigFile.Name -replace '\.sig$',''
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Signature file is empty: $($sigFile.FullName)"
          }
          $downloadUrl = "$env:PUBLIC_BASE_URL/$OS_NAME/$VERSION/$artifactName"
          $content = @{
            version = $VERSION
            notes = ""
            pub_date = $TIMESTAMP
            url = $downloadUrl
            signature = $signature
          } | ConvertTo-Json -Compress
          Set-Content -Path version.json -Value $content
          aws --endpoint-url "$env:R2_ENDPOINT" s3 cp version.json "s3://$env:R2_BUCKET/releases-v2/$OS_NAME/$VERSION/version.json"
        shell: pwsh
