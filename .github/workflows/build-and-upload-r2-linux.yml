name: Build and Upload to R2 (Linux)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      STABLE_BUCKET: pixelplay
      BETA_BUCKET: pixellauncher
      STABLE_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixelplay
      BETA_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixellauncher
      STABLE_PUBLIC_BASE_URL: https://pub-dda9306a363141bc9aece427638fbb4a.r2.dev/pixelplay/releases-v2
      BETA_PUBLIC_BASE_URL: https://pub-fb468072650f40c9884e13b2bc758f60.r2.dev/pixelplay/releases-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential xdg-utils libfuse2 file

      - name: Install yarn
        run: |
          curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | sudo apt-key add -
          echo "deb https://dl.yarnpkg.com/debian/ stable main" | sudo tee /etc/apt/sources.list.d/yarn.list
          sudo apt-get update
          sudo apt-get install -y yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Add yarn to PATH
        run: echo "$(yarn global bin)" >> $GITHUB_PATH

      - name: Set up AppImage environment
        run: |
          # Extract AppImage tools if needed (they need execute permissions)
          echo "Setting up AppImage environment..."
          export ARCH=x86_64
          
      - name: Build Tauri app
        run: yarn tauri build
        env:
          PERSONAL_GH_PAT: ${{ secrets.PERSONAL_GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64

      - name: Package artifacts
        run: |
          mkdir -p ci-artifacts
          # Copy both AppImage and DEB
          cp -r src-tauri/target/release/bundle/appimage/* ci-artifacts/
          cp -r src-tauri/target/release/bundle/deb/* ci-artifacts/
          # List what we packaged
          echo "Packaged files:"
          ls -lah ci-artifacts/

      - name: Set upload variables
        id: setvars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "bucket=${{ env.STABLE_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.STABLE_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "public_base_url=${{ env.STABLE_PUBLIC_BASE_URL }}" >> $GITHUB_OUTPUT
            echo "type=stable" >> $GITHUB_OUTPUT
          else
            echo "bucket=${{ env.BETA_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.BETA_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "public_base_url=${{ env.BETA_PUBLIC_BASE_URL }}" >> $GITHUB_OUTPUT
            echo "type=beta" >> $GITHUB_OUTPUT
          fi

      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install awscli

      - name: Remove previous builds for this arch/os
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          OS_NAME="linux-x86_64"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          aws --endpoint-url "$R2_ENDPOINT" s3 rm s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/ --recursive || true

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          OS_NAME="linux-x86_64"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          # Upload all files from ci-artifacts directory
          for file in ci-artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading: $filename"
              aws --endpoint-url "$R2_ENDPOINT" s3 cp "$file" "s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/$filename"
            fi
          done

      - name: Generate and upload version JSON
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
          TYPE: ${{ steps.setvars.outputs.type }}
          PUBLIC_BASE_URL: ${{ steps.setvars.outputs.public_base_url }}
        run: |
          OS_NAME="linux-x86_64"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIG_FILE=$(ls -1 ci-artifacts/*.sig 2>/dev/null | head -n 1)
          if [ -z "$SIG_FILE" ]; then
            echo "No signature file (*.sig) found in ci-artifacts; updater manifest cannot be generated."
            exit 1
          fi
          SIGNATURE=$(tr -d '\r\n' < "$SIG_FILE")
          if [ -z "$SIGNATURE" ]; then
            echo "Signature file is empty: $SIG_FILE"
            exit 1
          fi
          ARTIFACT_NAME=$(basename "$SIG_FILE" .sig)
          DOWNLOAD_URL="$PUBLIC_BASE_URL/$OS_NAME/$VERSION/$ARTIFACT_NAME"
          printf '{"version":"%s","notes":"","pub_date":"%s","url":"%s","signature":"%s"}' "$VERSION" "$TIMESTAMP" "$DOWNLOAD_URL" "$SIGNATURE" > version.json
          aws --endpoint-url "$R2_ENDPOINT" s3 cp version.json s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/version.json
