name: Build and Upload to R2 (macOS Intel)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      STABLE_BUCKET: pixelplay
      BETA_BUCKET: pixellauncher
      STABLE_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixelplay
      BETA_ENDPOINT: https://3e2952346f3e901e55bcbc7e074595f4.r2.cloudflarestorage.com/pixellauncher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Build Tauri app
        run: |
          npx tauri build
        env:
          PERSONAL_GH_PAT: ${{ secrets.PERSONAL_GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package artifacts
        run: |
          mkdir -p ci-artifacts
          cp -r src-tauri/target/release/bundle/macos/* ci-artifacts/

      - name: Set upload variables
        id: setvars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "bucket=${{ env.STABLE_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.STABLE_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "type=stable" >> $GITHUB_OUTPUT
          else
            echo "bucket=${{ env.BETA_BUCKET }}" >> $GITHUB_OUTPUT
            echo "endpoint=${{ env.BETA_ENDPOINT }}" >> $GITHUB_OUTPUT
            echo "type=beta" >> $GITHUB_OUTPUT
          fi

      - name: Install AWS CLI
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install awscli --break-system-packages

      - name: Remove previous builds for this arch/os
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          OS_NAME="mac-intel"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          aws --endpoint-url "$R2_ENDPOINT" s3 rm s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/ --recursive || true

      - name: Upload artifacts to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
        run: |
          OS_NAME="mac-intel"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          # Upload all files from ci-artifacts directory
          for file in ci-artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading: $filename"
              aws --endpoint-url "$R2_ENDPOINT" s3 cp "$file" "s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/$filename"
            fi
          done

      - name: Generate and upload version JSON
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ steps.setvars.outputs.endpoint }}
          R2_BUCKET: ${{ steps.setvars.outputs.bucket }}
          TYPE: ${{ steps.setvars.outputs.type }}
        run: |
          OS_NAME="mac-intel"
          VERSION=$(grep 'version' src-tauri/tauri.conf.json | head -1 | cut -d '"' -f4)
          BUILD_NAME="pixelplay-launcher"
          FORMAT="zip"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"version\": \"$VERSION\", \"name\": \"$BUILD_NAME\", \"format\": \"$FORMAT\", \"os\": \"$OS_NAME\", \"timestamp\": \"$TIMESTAMP\", \"type\": \"$TYPE\"}" > version.json
          aws --endpoint-url "$R2_ENDPOINT" s3 cp version.json s3://$R2_BUCKET/releases-v2/${OS_NAME}/$VERSION/version.json
